<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سعر الدولار اليوم في السودان</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 25px;
        }
        h1 {
            color: #2e7d32;
            margin-bottom: 10px;
        }
        .update-time {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .currency {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 10px;
            border-right: 5px solid #2e7d32;
        }
        .currency-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .price {
            font-size: 22px;
            font-weight: bold;
            color: #2e7d32;
        }
        .flag {
            font-size: 24px;
            margin-left: 10px;
        }
        .note {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💵 أسعار العملات في السودان</h1>
        <p class="update-time">آخر تحديث: الخميس، 29 مايو 2026 - 1:50 م</p>
        
        <div class="currency">
            <span class="currency-name"><span class="flag">🇺🇸</span> الدولار الأمريكي</span>
            <span class="price">4,300</span>
        </div>
        
        <div class="currency">
            <span class="currency-name"><span class="flag">🇸🇦</span> الريال السعودي</span>
            <span class="price">1,140</span>
        </div>
        
        <div class="currency">
            <span class="currency-name"><span class="flag">🇦🇪</span> الدرهم الإماراتي</span>
            <span class="price">1,171</span>
        </div>
        
        <div class="currency">
            <span class="currency-name"><span class="flag">🇪🇺</span> اليورو</span>
            <span class="price">5,058</span>
        </div>

        <p class="note">* الأسعار من السوق الموازي وقد تختلف بين الولايات حسب العرض والطلب</p>
    </div>
</body>
</html>
